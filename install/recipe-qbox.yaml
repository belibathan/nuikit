# nuikit on a fresh Qbox server: a txAdmin recipe.
#
# txAdmin → Setup → "Custom recipe" → paste this file's URL (or its contents). It deploys the stock
# Qbox recipe (Qbox-project/txAdminRecipe), then adds nuikit from the latest GitHub release and writes
# a server.cfg that starts it in the right order with `exec @nuikit/nuikit.cfg`.
#
# STATUS: written for 0.7.0 and never run on a real txAdmin (as of Oct 23, 2026). Treat it as a starting point.
# It does not install the overrides: once the server is up, run `nuikit install` in the console (docs/install.md).
$engine: 3
$onesync: on
name: Qbox + nuikit
version: 0.7.0
author: '@belibathan'
description: Qbox with one design system for the whole server (nuikit).

tasks:
  # ── Stock Qbox (its own recipe, verbatim) ─────────────────────────────────────────────────────────
  - action: download_github
    src: https://github.com/Qbox-project/txAdminRecipe
    ref: main
    dest: ./tmp/qbox
  - action: waste_time
    seconds: 2
  # Everything the Qbox recipe would do is in that repository's qbox.yaml. txAdmin runs one recipe at a
  # time, so copy its tasks here when you adopt this file (they change often; this file does not pin them).

  # ── nuikit ─────────────────────────────────────────────────────────────────────────────────────────
  - action: download_file
    path: ./tmp/nuikit.zip
    url: https://github.com/belibathan/nuikit/releases/latest/download/nuikit.zip
  - action: unzip
    src: ./tmp/nuikit.zip
    dest: ./tmp/nuikit
  - action: move_path
    src: ./tmp/nuikit/[nuikit]
    dest: ./resources/[nuikit]
    overwrite: true

  # ── server.cfg: Qbox's, then nuikit after the framework ──────────────────────────────────────────
  - action: move_path
    src: ./tmp/qbox/server.cfg
    dest: ./server.cfg
    overwrite: true
  - action: replace_string
    file: ./server.cfg
    mode: literal
    search: 'ensure pma-voice'
    replace: |
      ensure pma-voice

      # nuikit: one design system for the whole server (resources/[nuikit]/nuikit/nuikit.cfg)
      exec @nuikit/nuikit.cfg
      stop qbx_hud
      stop loadscreen
      stop qbx_chat_theme

  - action: remove_path
    path: ./tmp
