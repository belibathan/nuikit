<!doctype html>
<!--
  Identity surface spike (bench/identity/results.md). One page, one variant per ?v=, one scene per ?scene=.
  Eight panels at 1920×1080 (a menu, three notices, a progress bar, a dialog, a HUD row) drawn with the
  identity surface recipe under test, over a background that moves.

  ?v=      flat | v1 | edge | soft | deep | glow | cut | cut-drop | all
  ?scene=  composite  background is its own layer and moves with transform (the game under NUI: panels never repaint)
           content    background still, a fill inside every panel animates (panels repaint every frame)
           transform  background still, the fill animates with transform on its own layer (how shadcn Progress moves)
           repaint    background animates background-position (everything repaints every frame: worst case)
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>identity spike</title>
    <style>
      :root {
        --popover-rgb: 23, 23, 23;
        --popover-foreground-rgb: 250, 250, 250;
        --border: rgba(255, 255, 255, 0.1);
        --brand-rgb: 96, 165, 250;
        --scrim-rgb: 0, 0, 0;
        --nk-surface-opacity: 0.96;
        --nk-surface-gradient: 0.04;
        --nk-surface-edge: 0.06;
        --nk-glow: 0.35;
        --nk-cut: 8px;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font: 14px/20px system-ui, sans-serif;
        color: rgb(var(--popover-foreground-rgb));
        background: transparent;
      }
      /* The "game": a big striped field, so every effect is drawn over detail. */
      #bg {
        position: fixed;
        inset: -200px;
        background:
          repeating-linear-gradient(45deg, rgba(120, 160, 220, 0.9) 0 40px, rgba(40, 60, 90, 0.9) 40px 80px),
          linear-gradient(180deg, #9cc8ff, #2a3550);
        background-blend-mode: multiply;
      }
      .composite #bg {
        will-change: transform;
        animation: pan 2s linear infinite;
      }
      .repaint #bg {
        animation: pos 2s linear infinite;
      }
      @keyframes pan {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(113px, 113px, 0); }
      }
      @keyframes pos {
        from { background-position: 0 0, 0 0; }
        to { background-position: 113px 113px, 0 0; }
      }

      .panel {
        position: absolute;
        box-sizing: border-box;
        padding: 12px 16px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background-color: rgba(var(--popover-rgb), var(--nk-surface-opacity));
      }
      .fill {
        height: 6px;
        margin-top: 10px;
        border-radius: 3px;
        background: rgba(var(--brand-rgb), 1);
        width: 40%;
      }
      .content .fill {
        animation: grow 1s linear infinite alternate;
      }
      /* the same fill animated the way shadcn's Progress does it: transform, on its own layer */
      .transform .fill {
        width: 90%;
        transform-origin: left;
        will-change: transform;
        animation: grow-t 1s linear infinite alternate;
      }
      @keyframes grow-t {
        from { transform: scaleX(0.11); }
        to { transform: scaleX(1); }
      }
      @keyframes grow {
        from { width: 10%; }
        to { width: 90%; }
      }
      .row {
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        padding: 0 12px;
      }
      .row.active {
        background: rgba(var(--popover-foreground-rgb), 0.08);
      }

      /* v1: today's nk-panel */
      .v1 .panel {
        box-shadow: 0 0 0 1px rgb(0 0 0 / 0.25), 0 24px 64px -24px rgb(0 0 0 / 0.7);
      }
      /* edge: gradient + machined inner edge, no outer shadow */
      .edge .panel,
      .soft .panel,
      .deep .panel,
      .glow .panel,
      .all .panel {
        background-image: linear-gradient(
          180deg,
          rgba(var(--popover-foreground-rgb), var(--nk-surface-gradient)),
          rgba(var(--popover-foreground-rgb), 0) 60%
        );
      }
      .edge .panel {
        box-shadow: inset 0 1px 0 0 rgba(var(--popover-foreground-rgb), var(--nk-surface-edge));
      }
      .soft .panel {
        box-shadow:
          inset 0 1px 0 0 rgba(var(--popover-foreground-rgb), var(--nk-surface-edge)),
          0 0 0 1px rgba(var(--scrim-rgb), 0.25),
          0 12px 32px -12px rgba(var(--scrim-rgb), 0.6);
      }
      .deep .panel,
      .glow .panel,
      .all .panel {
        box-shadow:
          inset 0 1px 0 0 rgba(var(--popover-foreground-rgb), var(--nk-surface-edge)),
          0 0 0 1px rgba(var(--scrim-rgb), 0.3),
          0 2px 4px rgba(var(--scrim-rgb), 0.25),
          0 16px 40px -8px rgba(var(--scrim-rgb), 0.55),
          0 40px 96px -24px rgba(var(--scrim-rgb), 0.7);
      }
      .glow .row.active,
      .all .row.active {
        box-shadow: 0 0 0 1px rgba(var(--brand-rgb), 0.6), 0 0 24px rgba(var(--brand-rgb), var(--nk-glow));
      }
      .glow .fill,
      .all .fill {
        box-shadow: 0 0 12px rgba(var(--brand-rgb), var(--nk-glow));
      }
      /* cut corners: clip-path polygon (clips the outer box-shadow, so cut identities draw depth another way) */
      .cut .panel,
      .cut-drop .panel,
      .all .panel {
        border-radius: 0;
        clip-path: polygon(
          var(--nk-cut) 0, 100% 0, 100% calc(100% - var(--nk-cut)),
          calc(100% - var(--nk-cut)) 100%, 0 100%, 0 var(--nk-cut)
        );
      }
      /* cut + drop-shadow: the shadow on a wrapper, since clip-path clips the panel's own */
      .wrap {
        position: absolute;
      }
      .cut-drop .wrap,
      .all .wrap {
        filter: drop-shadow(0 12px 20px rgba(var(--scrim-rgb), 0.55));
      }
      .wrap > .panel {
        position: relative;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <div id="ui"></div>
    <script>
      const q = new URLSearchParams(location.search);
      document.body.className = `${q.get("v") ?? "flat"} ${q.get("scene") ?? "composite"}`;
      // x, y, w, h, rows
      const layout = [
        [48, 260, 380, 480, 9], // context menu
        [1492, 48, 380, 84, 0], // notices
        [1492, 148, 380, 84, 0],
        [1492, 248, 380, 84, 0],
        [760, 960, 400, 64, 0], // progress
        [720, 380, 480, 300, 3], // dialog
        [48, 960, 260, 64, 0], // HUD row
        [1600, 900, 272, 132, 0], // vehicle
      ];
      const ui = document.getElementById("ui");
      for (const [x, y, w, h, rows] of layout) {
        const wrap = document.createElement("div");
        wrap.className = "wrap";
        wrap.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
        const p = document.createElement("div");
        p.className = "panel";
        p.style.cssText = `width:${w}px;height:${h}px`;
        p.innerHTML = `<div>Panel ${w}×${h}</div><div class="fill"></div>`;
        for (let i = 0; i < rows; i++) p.innerHTML += `<div class="row ${i === 1 ? "active" : ""}">Row ${i + 1}</div>`;
        wrap.appendChild(p);
        ui.appendChild(wrap);
      }
      // frame intervals, read by spike.mjs
      window.__frames = [];
      let last = performance.now();
      const tick = (t) => {
        window.__frames.push(t - last);
        last = t;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
