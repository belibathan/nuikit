<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nuikit slab specimen</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <!--
      The slab anatomy (design v2 §4.5, docs/tokens.md#slabs) and a small panel, in whatever identity
      `nuikit:theme` sends. Only kit utilities and tokens: no styles of its own besides placement.
    -->
    <main class="relative h-screen w-screen overflow-hidden text-foreground">
      <!-- item add/remove: icon tile + name + delta -->
      <section class="nk-anchor-tl flex flex-col items-start gap-1.5" style="top: 22%">
        <div class="nk-slab nk-enter min-w-60">
          <span class="nk-slab-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M9 2v3l-2 4v11a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9l-2-4V2" /></svg></span>
          Water bottle<span class="nk-slab-delta">+2</span>
        </div>
        <div class="nk-slab nk-enter min-w-60">
          <span class="nk-slab-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="2" /><path d="M12 10v4M10 12h4" /></svg></span>
          Bandage<span class="nk-slab-delta">+1</span>
        </div>
        <div class="nk-slab nk-enter min-w-60">
          <span class="nk-slab-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4" /><path d="M10.85 12.15 19 4M18 5l2 2M15 8l2 2" /></svg></span>
          Lockpick<span class="nk-slab-delta" data-delta="down">−1</span>
        </div>
      </section>

      <!-- prompts: key chip + verb -->
      <section class="nk-anchor-r flex flex-col items-start gap-1.5" style="right: 30%">
        <div class="nk-slab"><kbd class="nk-slab-key">E</kbd>Clean dishes</div>
        <div class="nk-slab"><kbd class="nk-slab-key">G</kbd>Search the counter</div>
      </section>

      <!-- a panel: header with caption, rows, a stat -->
      <section class="nk-anchor-tr nk-panel w-80 overflow-hidden" style="top: 12%">
        <header class="nk-panel-header">
          <div class="min-w-0 flex-1">
            <p class="nk-title">Mission Row garage</p>
            <p class="nk-label">2 of 6 spots used</p>
          </div>
        </header>
        <div class="nk-panel-body flex flex-col">
          <div class="nk-row" data-active><span class="flex-1">Sultan RS</span><span class="nk-caption">Stored</span></div>
          <div class="nk-row"><span class="flex-1">Elegy Retro</span><span class="nk-caption">Stored</span></div>
          <div class="nk-row"><span class="flex-1">Bati 801</span><span class="nk-caption">Impounded</span></div>
        </div>
        <footer class="nk-panel-footer justify-between">
          <div>
            <p class="nk-caption">Balance</p>
            <p class="nk-num text-2xl font-semibold">$48,250</p>
          </div>
          <div class="text-right">
            <p class="nk-caption">Fuel</p>
            <p class="nk-num text-2xl font-semibold">71%</p>
          </div>
        </footer>
      </section>

      <!-- progress: label + thin line + cancel key -->
      <section class="nk-anchor-b" style="bottom: 9.5rem">
        <div class="nk-slab-stack">
          <div class="nk-slab-stack-row">
            <span class="nk-caption">Raw crystals</span>
            <kbd class="nk-slab-key">Esc</kbd>Cancel
          </div>
          <div class="nk-slab-line" style="--nk-slab-progress: 0.45"></div>
        </div>
      </section>

      <!-- incapacitated: a full-width band at the bottom, toned destructive -->
      <section class="absolute inset-x-0 bottom-10" style="--nk-slab-tone-rgb: var(--destructive-rgb)">
        <div class="nk-slab-band">
          <p class="nk-slab-band-title">You are incapacitated</p>
          <p class="nk-caption">Wait for EMS</p>
        </div>
      </section>
    </main>
  </body>
</html>
