<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="nuikit-handshake" content="off">
<title>nuikit spike: runtime frame</title>
<style>
  html, body { margin: 0; background: transparent; }
  #out { position: fixed; right: 1rem; bottom: 1rem; font: 0.75rem/1.4 monospace; color: #fff; text-shadow: 0 0 0.25rem #000; pointer-events: none; }
</style>
</head>
<body>
<div id="out">spike route frame: 0 rendered</div>
<script>
  // Plays the runtime's renderer frame: receives an intent, "draws" it (a counter), resolves it
  // back to Lua at once. The time between the message arriving and the resolve POST leaving is
  // reported as frameMs so the Lua side can subtract it.
  var out = document.getElementById('out');
  var count = 0;
  var SELF = 'https://' + (window.GetParentResourceName ? GetParentResourceName() : 'nuikit_spike_route') + '/resolve';
  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.action !== 'spike:render') return;
    var t0 = performance.now();
    count++;
    out.textContent = 'spike route frame: ' + count + ' rendered (last ' + (m.intent || '?') + ' ' + m.id + ')';
    if (m.fireAndForget) return;
    fetch(SELF, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: m.id, frameMs: Math.round((performance.now() - t0) * 100) / 100 })
    });
  });
</script>
</body>
</html>
