<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="nuikit-handshake" content="off">
<title>nuikit spike: library page</title>
<style>
  html, body { margin: 0; background: transparent; }
  #out { position: fixed; left: 1rem; bottom: 1rem; font: 0.75rem/1.4 monospace; color: #fff; text-shadow: 0 0 0.25rem #000; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="out"></div>
<script>
  // Plays the ox_lib override page. It has no Lua of its own it can change (the override is web
  // only), so it posts intents straight to another resource's NUI callback, the way the real page
  // would post to https://nuikit/intent. Two round trips are timed, in ms, from this page:
  //   echo: page → nuikit_spike_route Lua → page                       (the callback hop alone)
  //   full: page → Lua → the route's renderer frame → Lua → page      (what an intent costs)
  // Chromium 103: no optional chaining or ?? below.
  var out = document.getElementById('out');
  var RUNTIME = 'https://nuikit_spike_route/intent';
  var SELF = 'https://' + (window.GetParentResourceName ? GetParentResourceName() : 'nuikit_spike_caller') + '/spike:result';

  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.text(); })
      .then(function (t) { try { return JSON.parse(t); } catch (e) { return { raw: t }; } });
  }

  function stats(samples) {
    samples.sort(function (a, b) { return a - b; });
    var n = samples.length;
    var sum = samples.reduce(function (a, b) { return a + b; }, 0);
    return {
      n: n,
      avg: Math.round((sum / n) * 100) / 100,
      p50: Math.round(samples[Math.floor(n * 0.5)] * 100) / 100,
      p95: Math.round(samples[Math.min(n - 1, Math.floor(n * 0.95))] * 100) / 100,
      max: Math.round(samples[n - 1] * 100) / 100
    };
  }

  function run(n) {
    var echo = [], full = [], failed = 0;
    var i = 0;
    function next() {
      if (i >= n) return done();
      var id = 'c' + i;
      var t0 = performance.now();
      post(RUNTIME, { id: id, intent: 'notify', echo: true, props: { title: 'echo ' + i } })
        .then(function () {
          echo.push(performance.now() - t0);
          var t1 = performance.now();
          return post(RUNTIME, { id: id, intent: 'notify', props: { title: 'full ' + i } }).then(function (r) {
            if (!r || r.id !== id) failed++;
            full.push(performance.now() - t1);
          });
        })
        .catch(function () { failed++; })
        .then(function () { i++; next(); });
    }
    function done() {
      var result = { n: n, failed: failed, echo_ms: echo.length ? stats(echo) : null, full_ms: full.length ? stats(full) : null };
      out.textContent = 'spike route\n' + JSON.stringify(result, null, 1);
      post(SELF, result);
    }
    out.textContent = 'spike route: posting ' + n + ' intents…';
    next();
  }

  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.action === 'spike:run') run(m.n || 50);
  });
</script>
</body>
</html>
