name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: token
        # Releases need an NPM_TOKEN secret. Until it exists, skip quietly instead of failing.
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.present == 'true'
        name: Authenticate to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          if ! who=$(npm whoami 2>&1); then
            echo "::error title=npm auth failed::$(echo "$who" | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=npm::publishing as $who"

      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        run: pnpm -r --filter "./packages/**" build

      - if: steps.token.outputs.present == 'true'
        id: pending
        run: |
          n=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"

      # Pending changesets → open/update the "Version packages" PR.
      - if: steps.token.outputs.present == 'true' && steps.pending.outputs.count != '0'
        uses: changesets/action@v1
        with:
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No pending changesets → publish any version that isn't on npm yet.
      - if: steps.token.outputs.present == 'true' && steps.pending.outputs.count == '0'
        name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -o pipefail
          if ! pnpm changeset publish 2>&1 | tee publish.log; then
            echo "::error title=npm publish failed::$(grep -iE 'npm (error|ERR)|E4[0-9][0-9]|ENEED|provenance|forbidden' publish.log | head -8 | tr '\n' ' ')"
            exit 1
          fi
          git push --follow-tags || true
