name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Failures also become annotations (readable from the API without the log blob).
      - name: pnpm build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log || { grep -iE "error|cannot|failed|not found" build.log | tail -20 | sed 's/^/::error::/'; exit 1; }
      # Synced copies (web/src/components/ui, hooks, lib/utils.ts, index.css, client/*.lua, the nuikit
      # resource's lib/ and themes/) are generated: a hand edit or a source change without `pnpm sync` fails here.
      - name: Synced copies match their sources (pnpm sync)
        run: |
          pnpm sync > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            git status --short | sed 's/^/  /'
            echo "::error title=Synced copies drifted::pnpm sync changed the files above. Synced copies are never edited by hand: edit the source each file's first line names (registry/nuikit/ui, vendor/shadcn/ui, registry/nuikit/hooks, packages/core/lua, packages/create-nuikit/kit.css or index.css.tpl), run pnpm sync, and commit the result."
            git diff --stat | tail -1
            exit 1
          fi
      # The arsenal (packages/core/src/spec/api) is the source: its generated files (arsenal.json, src/domains,
      # lua/api.lua, src/events.generated.ts, package.json exports) must be what the spec makes.
      - name: Arsenal generated from the spec
        run: node packages/core/scripts/arsenal.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      # Protocol conformance (docs/protocol.md §10): every page is native (level 3); the theme
      # resource and the chat theme have no page of their own, so level 1 is their maximum.
      - name: nuikit check
        run: |
          node packages/cli/dist/cli.js check systems/nuikit_death systems/nuikit_hud systems/nuikit_loading systems/nuikit_pause addons packages/create-nuikit/template --level 3
          node packages/cli/dist/cli.js check systems --level 1
