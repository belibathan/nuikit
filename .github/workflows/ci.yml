name: CI

on:
  push:
    branches: [main, "lead/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Failures also become annotations (readable from the API without the log blob).
      - name: pnpm build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log || { grep -iE "error|cannot|failed|not found" build.log | tail -20 | sed 's/^/::error::/'; exit 1; }
      # Synced copies (web/src/components/ui, hooks, lib/utils.ts, index.css, client/*.lua, the nuikit
      # resource's lib/ and themes/) are generated: a hand edit or a source change without `pnpm sync` fails here.
      - name: Synced copies match their sources (pnpm sync)
        run: |
          pnpm sync > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            git status --short | sed 's/^/  /'
            echo "::error title=Synced copies drifted::pnpm sync changed the files above. Synced copies are never edited by hand: edit the source each file's first line names (registry/nuikit/ui, vendor/shadcn/ui, registry/nuikit/hooks, packages/core/lua, packages/create-nuikit/kit.css or index.css.tpl), run pnpm sync, and commit the result."
            git diff --stat | tail -1
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      # Protocol conformance (docs/protocol.md §10): every page is native (level 3); the theme
      # resource and the chat theme have no page of their own, so level 1 is their maximum.
      - name: nuikit check
        run: |
          node packages/cli/dist/cli.js check systems/nuikit_death systems/nuikit_hud systems/nuikit_loading systems/nuikit_pause addons packages/create-nuikit/template --level 3
          node packages/cli/dist/cli.js check systems --level 1
      # The warning ratchet (scripts/check-burndown.mjs): a folder's `nuikit check` warnings may only go down
      # against bench/check-baseline.json; the table lands in the job summary (docs/roadmap.md Track C).
      - name: nuikit check burn-down
        run: node scripts/check-burndown.mjs
      # Class strings (eslint.config.js): conflicting, unknown and forbidden classes. Warnings, never a failure.
      - name: Class lint (warnings)
        run: pnpm lint:classes

  chromium-103:
    name: Render in Chromium 103 (FiveM CEF)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter vite-plugin-nuikit build
      - run: pnpm proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-103-render
          path: examples/cef-proof/out/*.png

  visual:
    name: Visual baselines (Chromium 103)
    runs-on: ubuntu-latest
    needs: test
    # Advisory: shots are a CI artifact to look at, never committed (no stored images in the repo).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build
      # The site (/components) is a modern page: it gets Playwright's Chromium; HUD and pause run in 103.
      - run: node node_modules/.pnpm/playwright-core@1.56.0/node_modules/playwright-core/cli.js install --with-deps chromium
      # HUD, pause and /components under five identities. No baselines are committed, so every shot is `new`
      # and lands in bench/visual/out for a lane to look at; run locally with baselines to diff.
      - run: pnpm visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual
          path: bench/visual/out/*.png
          if-no-files-found: ignore

  scaffold:
    name: create-nuikit end to end
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build
      - run: node "$GITHUB_WORKSPACE/packages/create-nuikit/dist/index.js" e2e-hud --yes --pm pnpm --link "$GITHUB_WORKSPACE"
        working-directory: ${{ runner.temp }}
      - run: pnpm build && grep -q "web/dist/index.html" ../fxmanifest.lua
        working-directory: ${{ runner.temp }}/e2e-hud/web
      # Every block as a template: scaffolds, builds, and passes the level-3 conformance gate.
      - name: Block templates (npm create nuikit -t <block>)
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          for t in $(ls "$GITHUB_WORKSPACE/registry/nuikit/blocks"); do
            node "$GITHUB_WORKSPACE/packages/create-nuikit/dist/index.js" "tpl-$t" -t "$t" --yes --pm pnpm --link "$GITHUB_WORKSPACE"
            (cd "tpl-$t/web" && pnpm build)
            node "$GITHUB_WORKSPACE/packages/cli/dist/cli.js" check "tpl-$t" --level 3
          done
