<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;background:#0a0a0a;color:#fafafa;font-family:Inter,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1.3fr 1fr 1fr}
.c{outline:1px solid #262626;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.l{position:absolute;left:18px;top:14px;font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#737373}
.big{grid-column:span 2}.tall{grid-row:span 1}
.wm{font-weight:650;letter-spacing:-.045em;line-height:1}
.tag{font:400 14px/1 ui-monospace,Menlo,monospace;color:#a3a3a3}
.row{display:flex;align-items:center;gap:22px}
.light{background:#fafafa;color:#0a0a0a}
svg path{fill:currentColor}
.kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:5px;background:#262626;font:600 12px ui-monospace,monospace;color:#d4d4d4}
.grid{background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:20px 20px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="m" viewBox="0 0 100 100"><path d="M10 90 V30 A20 20 0 0 1 30 10 H71.67 L35 32 V80 Z M35 48 V40 L85 10 H90 V15 Z M65 38 L90 23 V90 L65 80 Z"/></symbol></defs></svg>
<div class="c big"><span class="l">Primary lockup</span>
  <div class="row"><svg width="150" height="150"><use href="#m"/></svg><span class="wm" style="font-size:120px">nuikit</span></div>
  <span class="tag">shadcn/ui for FiveM, rendered right.</span></div>
<div class="c light"><span class="l">Light</span><div class="row"><svg width="84" height="84"><use href="#m"/></svg><span class="wm" style="font-size:64px">nuikit</span></div></div>
<div class="c grid"><span class="l">Construction</span>
  <svg width="220" height="220" viewBox="0 0 100 100" style="overflow:visible">
    <path d="M10 90 V30 A20 20 0 0 1 30 10 H71.67 L35 32 V80 Z M35 48 V40 L85 10 H90 V15 Z M65 38 L90 23 V90 L65 80 Z" style="fill:#fafafa;opacity:.92"/>
    <g stroke="#ef4444" stroke-width=".35" fill="none" stroke-dasharray="1.5 1">
      <line x1="10" y1="0" x2="10" y2="100"/><line x1="35" y1="0" x2="35" y2="100"/><line x1="65" y1="0" x2="65" y2="100"/><line x1="90" y1="0" x2="90" y2="100"/>
      <line x1="0" y1="10" x2="100" y2="10"/><line x1="0" y1="90" x2="100" y2="90"/>
      <line x1="20" y1="65" x2="100" y2="17"/><line x1="20" y1="57" x2="100" y2="9"/><line x1="20" y1="49" x2="100" y2="1"/><line x1="20" y1="41" x2="100" y2="-7"/>
    </g></svg>
  <span class="tag" style="font-size:11px">legs 25 · bands 8 = gaps 8 · 31°</span></div>
<div class="c"><span class="l">App icons</span><div class="row">
  <div style="width:96px;height:96px;border-radius:22px;background:#fafafa;display:grid;place-items:center;color:#0a0a0a"><svg width="60" height="60"><use href="#m"/></svg></div>
  <div style="width:96px;height:96px;border-radius:22px;background:#171717;outline:1px solid #262626;display:grid;place-items:center"><svg width="60" height="60"><use href="#m"/></svg></div></div></div>
<div class="c"><span class="l">Sizes</span><div class="row" style="align-items:flex-end">
  <svg width="64" height="64"><use href="#m"/></svg><svg width="32" height="32"><use href="#m"/></svg><svg width="16" height="16"><use href="#m"/></svg></div>
  <span class="tag" style="font-size:11px">64 · 32 · 16</span></div>
<div class="c"><span class="l">Avatar</span><div style="width:110px;height:110px;border-radius:50%;background:#fafafa;display:grid;place-items:center;color:#0a0a0a"><svg width="62" height="62"><use href="#m"/></svg></div></div>
<div class="c"><span class="l">Outline</span><svg width="110" height="110" viewBox="0 0 100 100"><path d="M10 90 V30 A20 20 0 0 1 30 10 H71.67 L35 32 V80 Z M35 48 V40 L85 10 H90 V15 Z M65 38 L90 23 V90 L65 80 Z" style="fill:none;stroke:#fafafa;stroke-width:2.5;stroke-linejoin:round"/></svg></div>
<div class="c big" style="background:linear-gradient(180deg,#1b1420,#09070b)"><span class="l">In context</span>
  <div class="row" style="gap:14px;padding:14px 18px;border:1px solid #ffffff1f;border-radius:12px;background:#0a0a0acc">
    <span class="kbd">E</span><span style="font-size:15px">Talk to dealer</span><span style="width:1px;height:22px;background:#ffffff26"></span>
    <svg width="22" height="22"><use href="#m"/></svg><b class="wm" style="font-size:20px">nuikit</b></div>
  <div class="row" style="gap:10px;font-size:14px;color:#a3a3a3"><svg width="18" height="18"><use href="#m"/></svg>npm create nuikit@latest</div></div>
<div class="c light"><span class="l">Favicon / tab</span>
  <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px 10px 0 0;background:#e5e5e5;font-size:13px"><svg width="16" height="16"><use href="#m"/></svg>nuikit — shadcn/ui for FiveM</div></div>
<div class="c"><span class="l">Mono / one color</span><div class="row"><svg width="70" height="70" style="color:#737373"><use href="#m"/></svg><svg width="70" height="70" style="color:#404040"><use href="#m"/></svg></div></div>
</body></html>
