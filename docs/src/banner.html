<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:var(--w);height:var(--h);background:#0a0a0a;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#f3f4fc;overflow:hidden;position:relative}
.glow{position:absolute;left:50%;top:-40%;width:1100px;height:520px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(149,90,255,.38),transparent);}
.glow2{position:absolute;right:-120px;bottom:-160px;width:620px;height:420px;background:radial-gradient(closest-side,rgba(0,190,250,.16),transparent)}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/48px 48px;-webkit-mask-image:radial-gradient(70% 80% at 50% 40%,#000,transparent)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.logo{display:flex;align-items:center;gap:22px;font-weight:800;letter-spacing:-.045em;font-size:var(--logo)}
.gem{width:calc(var(--logo)*.5);height:calc(var(--logo)*.5);transform:rotate(45deg);border-radius:22%;background:linear-gradient(135deg,#a78bfa,#22d3ee);box-shadow:0 0 40px rgba(167,139,250,.6)}
.tag{margin-top:14px;font-size:var(--tag);color:#b7bccb;font-weight:500;letter-spacing:-.01em}
.tag b{color:#fff;font-weight:700}
.chips{display:flex;gap:10px;margin-top:26px}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font-size:15px;color:#d6d9e3}
.dot{width:8px;height:8px;border-radius:50%}
.cmd{margin-top:28px;font:500 20px "JetBrains Mono",ui-monospace,monospace;padding:12px 22px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#171717;color:#e7e9ee}
.cmd span{color:#737373}
</style></head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="logo">nuikit</div>
  <div class="tag"><b>shadcn/ui + Tailwind v4 for FiveM</b>, rendered right in the game's Chromium 103.</div>
  <div class="chips">
    <div class="chip"><span class="dot" style="background:#737373"></span>Verified in Chromium 103</div>
    <div class="chip"><span class="dot" style="background:#737373"></span>Typed Lua ↔ React</div>
    <div class="chip"><span class="dot" style="background:#737373"></span>In-game HMR</div>
    <div class="chip"><span class="dot" style="background:#737373"></span>shadcn registry</div>
  </div>
  <div class="cmd"><span>$</span> npm create nuikit@latest</div>
</div>
</body></html>
