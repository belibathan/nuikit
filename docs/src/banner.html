<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(../../apps/www/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url(../../apps/www/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:var(--w,1280px);height:var(--h,640px);overflow:hidden}
body{background:#0a0a0a;color:#fafafa;font-family:Geist,sans-serif;position:relative}
/* Los Santos is Los Angeles: a real LA photo, blurred so it reads as "the city" not a specific place. */
.bg{position:absolute;inset:-40px;background:#0a0a0a var(--photo,none) center/cover no-repeat;filter:blur(var(--blur,6px)) saturate(1.05) brightness(1)}
.shade{position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 50%,rgba(10,10,10,.5),rgba(10,10,10,.12) 100%),linear-gradient(to bottom,rgba(10,10,10,.05) 30%,rgba(10,10,10,.7))}
.noise{position:absolute;inset:0;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 72px}
.lock{display:flex;align-items:center;gap:calc(var(--s)*.28);font-size:var(--s);font-weight:600;letter-spacing:-.045em;line-height:1}
.lock svg{width:calc(var(--s)*.92);height:calc(var(--s)*.92)}
.tag{margin-top:calc(var(--s)*.3);font-size:calc(var(--s)*.21);color:#d4d4d4;font-weight:450;letter-spacing:-.01em}
.tag b{color:#fafafa;font-weight:600}
.cmd{margin-top:calc(var(--s)*.34);font:500 calc(var(--s)*.155) "Geist Mono",monospace;padding:.7em 1.2em;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(23,23,23,.72);backdrop-filter:blur(8px);color:#e5e5e5}
.cmd span{color:#737373;margin-right:.6em}
.foot{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:400 12px "Geist Mono",monospace;color:rgba(250,250,250,.35);letter-spacing:.02em}
body.icon .wrap{padding:0}
body.icon .lock svg{width:calc(var(--w)*.56);height:calc(var(--w)*.56)}
</style></head>
<body>
<div class="bg"></div><div class="shade"></div><div class="noise"></div>
<div class="wrap">
  <div class="lock">
    <svg viewBox="10 10 80 80" fill="#fafafa"><path d="M10 90 V30 A20 20 0 0 1 30 10 H71.67 L35 32 V80 Z M35 48 V40 L85 10 H90 V15 Z M65 38 L90 23 V90 L65 80 Z"/></svg>
    <span class="word">nuikit</span>
  </div>
  <div class="tag"><b>shadcn/ui + Tailwind v4 for FiveM</b>, rendered right.</div>
  <div class="cmd"><span>$</span>npm create nuikit@latest</div>
</div>
<div class="foot"></div>
</body></html>
