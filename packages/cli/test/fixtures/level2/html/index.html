<!doctype html>
<html class="dark">
  <head>
    <meta charset="utf-8" />
    <style>
      .menu { background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="menu" hidden></div>
    <script>
      const post = (name, body) => fetch(`https://${GetParentResourceName()}/${name}`, { method: "POST", body: JSON.stringify(body ?? {}) });
      window.addEventListener("message", (e) => {
        if (e.data.action === "nuikit:surfaces") document.querySelector(".menu").hidden = !e.data.data.surfaces.menu?.visible;
      });
      // Escape goes through the protocol: Lua decides which surface it closes.
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") post("nuikit:escape");
      });
      post("nuikit:ready", { protocol: 1, client: "vanilla" });
    </script>
  </body>
</html>
