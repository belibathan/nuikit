# nuikit.cfg: one line in server.cfg starts nuikit in the right order.
#
#   exec @nuikit/nuikit.cfg
#
# Put it AFTER the lines that start ox_lib and your framework (ensure ox_lib, ensure [qbx] / qb-core /
# es_extended, ensure pma-voice) and BEFORE anything that imports @nuikit/init.lua. FiveM starts `nuikit`
# itself when a dependent starts, so the order here only matters for the screens that read framework data.
#
# FiveM splits cfg lines on semicolons even inside comments, so comments here never use one.
#
# Settings (convars) are read when nuikit starts. Change them here and `restart nuikit`.

# ── Settings ───────────────────────────────────────────────────────────────────────────────────────
# The host: renders the UI modules of resources that declare `nuikit_ui` in nuikit's own frame (docs/host.md).
# Opt-in prototype: 0 keeps every resource on its own ui_page.
setr nuikit_host 0

# Money and dates in every nuikit UI (ISO 4217 currency, BCP 47 locale). Scripts that pass their own win.
setr nuikit_currency USD
setr nuikit_locale en-US

# Admins may run `/nuikit theme reload` and `/nuikit doctor` in game.
add_ace group.admin command.nuikit allow

# ── Start ──────────────────────────────────────────────────────────────────────────────────────────
ensure nuikit
ensure [nuikit]

# ── Framework-specific: stop the stock screens these replace ──────────────────────────────────────
# Qbox starts resources by category, so stop the replaced ones by name after `ensure [qbx]`.
# (Delete a nuikit system you don't want instead of keeping both.)
# stop qbx_hud          # replaced by nuikit_hud (+ nuikit_stress keeps stress)
# stop loadscreen       # replaced by nuikit_loading
# stop qbx_chat_theme   # replaced by nuikit_chat
#
# QBCore:  # stop qb-hud, qb-loading
# ESX:     # stop esx_hud, esx_loadingscreen
#
# Adapter packs ([nuikit-ox], [nuikit-qb], [nuikit-esx]) are not shipped yet (docs/architecture.md §3):
# when they are, this file ensures the one that fits your framework. Until then, the overrides in the zip
# (ox_lib, ox_inventory, ox_target…) are copied over those resources' UI folders (see the zip's README).
